<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apollo & Cassandra VN</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LOADING -->
  <div id="loading-screen">
    <img src="assets/sunsprite.png" alt="Loading">
  </div>

  <!-- APP -->
  <div id="app" class="hidden">

    <!-- BG -->
    <div id="background"></div>

    <!-- SPRITES -->
    <div id="spriteLayer">
      <img id="apolloSprite" class="sprite left" src="assets/apollo.png">
      <img id="cassandraSprite" class="sprite right" src="assets/cassandra.png">
    </div>

    <!-- UI -->
    <div id="ui">
      <div id="dialogueBox">
        <div id="speakerName"></div>
        <div id="dialogueText"></div>

        <div id="bottomBar">
          <div id="choices"></div>

          <!-- NEXT BUTTON NOW EMBEDDED -->
          <img id="nextSun" src="assets/sunsprite.png" alt="Next">
        </div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
