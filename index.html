<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apollo & Cassandra VN</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- LOADING SCREEN -->
  <div id="loading-screen">
    <img src="assets/sunsprite.png" alt="Loading">
  </div>

  <!-- APP WRAPPER -->
  <div id="app" class="hidden">
    <!-- BACKGROUND -->
    <div id="background"></div>

    <!-- SPRITES -->
    <img id="apolloSprite" class="sprite left" src="assets/apollo.png" alt="Apollo">
    <img id="cassandraSprite" class="sprite right" src="assets/cassandra.png" alt="Cassandra">

    <!-- UI -->
    <div id="ui">
      <div id="dialogueBox">
        <div id="speakerName"></div>
        <div id="dialogueText"></div>
        <div id="choices"></div>
      </div>

      <!-- SUN BUTTON (NEXT) -->
      <img id="nextSun" src="assets/sunsprite.png" alt="Next">
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
